plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signingKeystore = System.getenv("HIBUDDY_KEYSTORE")

android {
    namespace 'com.example.hibuddy'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.hibuddy"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        if (signingKeystore) {
            hibuddy {
                storeFile file(signingKeystore)
                storeType "PKCS12"
                storePassword System.getenv("HIBUDDY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HIBUDDY_KEY_ALIAS") ?: "hibuddy"
                keyPassword System.getenv("HIBUDDY_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (signingKeystore) {
                signingConfig signingConfigs.hibuddy
            }
        }
        release {
            minifyEnabled false
        }
    }
    lint {
        checkOnly += "NewApi"
        abortOnError true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
