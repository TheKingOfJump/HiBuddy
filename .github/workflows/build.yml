name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout codice
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Genera Gradle Wrapper
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Prepara chiave di firma
      env:
        KEYSTORE_B64: ${{ secrets.HIBUDDY_KEYSTORE_B64 }}
        KEYSTORE_PASSWORD: ${{ secrets.HIBUDDY_KEYSTORE_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_B64" ]; then
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hibuddy.p12"
          echo "HIBUDDY_KEYSTORE=$RUNNER_TEMP/hibuddy.p12" >> "$GITHUB_ENV"
          echo "HIBUDDY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "HIBUDDY_KEY_ALIAS=hibuddy" >> "$GITHUB_ENV"
          echo "Chiave di firma pronta"
        else
          echo "Nessuna chiave di firma: uso la debug keystore predefinita"
        fi

    - name: Imposta versione build
      run: |
        sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" app/build.gradle
        sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
        grep -E "versionCode|versionName" app/build.gradle

    - name: Compila APK
      run: gradle assembleDebug

    - name: Verifica firma APK
      run: keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep -E "Owner|SHA256" || true

    - name: Carica APK pronto
      uses: actions/upload-artifact@v4
      with:
        name: HiBuddy-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Pubblica release con APK
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v${{ github.run_number }}" \
          app/build/outputs/apk/debug/app-debug.apk \
          --title "HiBuddy build ${{ github.run_number }}" \
          --notes "APK generato automaticamente dal commit ${{ github.sha }}" \
          || gh release upload "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --clobber
