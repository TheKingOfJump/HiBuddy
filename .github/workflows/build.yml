name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout codice
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Genera Gradle Wrapper
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Sistema URL Android
      run: |
        U=$(echo "aHR0cDovL3NjaGVtYXMuYW5kcm9pZC5jb20vYXBrL3Jlcy9hbmRyb2lk" | base64 -d)
        W=$(echo "d3NzOi8vZ2VuZXJhdGl2ZWxhbmd1YWdlLmdvb2dsZWFwaXMuY29tL3dzL2dvb2dsZS5haS5nZW5lcmF0aXZlbGFuZ3VhZ2UudjFiZXRhLkdlbmVyYXRpdmVTZXJ2aWNlLkJpZGlHZW5lcmF0ZUNvbnRlbnQ=" | base64 -d)
        sed -i "s|xmlns:android=\"[^\"]*\"|xmlns:android=\"$U\"|g" app/src/main/AndroidManifest.xml
        sed -i "s|xmlns:android=\"[^\"]*\"|xmlns:android=\"$U\"|g" app/src/main/res/layout/activity_main.xml
        sed -i "s|wss://[^\"]*|${W}?key=\$API_KEY|g" app/src/main/java/com/example/hibuddy/MainActivity.kt


    - name: Compila APK
      run: gradle assembleDebug

    - name: Carica APK pronto
      uses: actions/upload-artifact@v4
      with:
        name: HiBuddy-APK
        path: app/build/outputs/apk/debug/app-debug.apk
